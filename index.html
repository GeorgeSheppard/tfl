<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04081a" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>Tube Times</title>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>
          <svg
            class="roundel"
            viewBox="0 0 24 24"
            aria-hidden="true"
            width="26"
            height="26"
          >
            <circle cx="12" cy="12" r="9" fill="none" stroke="#DC241F" stroke-width="3.4" />
            <rect x="1" y="10.1" width="22" height="3.8" fill="#0019A8" />
          </svg>
          Tube Times
        </h1>
        <button id="add-btn">+ Add</button>
      </header>
      <div id="favourites"></div>
    </div>

    <dialog id="add-dialog">
      <h2>Add a station</h2>
      <input
        id="station-search"
        type="search"
        placeholder="Search station name…"
        autocomplete="off"
      />
      <div id="station-results" class="result-list"></div>
      <div id="route-results" class="result-list"></div>
      <div class="dialog-actions">
        <button id="cancel-add" type="button">Cancel</button>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
