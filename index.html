<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04081a" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='none' stroke='%23DC241F' stroke-width='3.4'/%3E%3Crect x='1' y='10.1' width='22' height='3.8' fill='%230019A8'/%3E%3C/svg%3E"
    />
    <title>Tube Times</title>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>
          <svg
            class="roundel"
            viewBox="0 0 24 24"
            aria-hidden="true"
            width="26"
            height="26"
          >
            <circle cx="12" cy="12" r="9" fill="none" stroke="#DC241F" stroke-width="3.4" />
            <rect x="1" y="10.1" width="22" height="3.8" fill="#0019A8" />
          </svg>
          Tube Times
        </h1>
        <button id="add-btn">+ Add</button>
      </header>
      <div id="favourites"></div>
    </div>

    <dialog id="add-dialog">
      <h2>Add a station</h2>
      <input
        id="station-search"
        type="search"
        placeholder="Search station name…"
        autocomplete="off"
      />
      <div id="station-results" class="result-list"></div>
      <div id="route-results" class="result-list"></div>
      <div class="dialog-actions">
        <button id="cancel-add" type="button">Cancel</button>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
